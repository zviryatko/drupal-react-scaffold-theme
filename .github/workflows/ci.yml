name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  base:
    name: Base theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist

  builder:
    name: Page builder editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Its unit tests run with the base theme's Jest (job "Base theme"); here it must build.
      - run: npm run builder:install
      - run: npm run builder:build
      - run: test -s modules/frame_builder/js/editor.js && test -s modules/frame_builder/js/frame-tokens.js

  example:
    name: Example subtheme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The example is built and tested by the base theme's tooling, it only installs its own libraries (rsuite...).
      - run: npm ci
      - run: npm ci
        working-directory: examples/frame_demo
      - run: npm run build
        working-directory: examples/frame_demo
      - run: npm test
        working-directory: examples/frame_demo

  new:
    name: frame new
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Base theme in themes/contrib, as on a site
        run: |
          mkdir -p "$RUNNER_TEMP/themes/contrib"
          git archive --prefix=frame/ HEAD | tar -x -C "$RUNNER_TEMP/themes/contrib"
          cd "$RUNNER_TEMP/themes/contrib/frame" && npm ci
      - name: Create, build and test a subtheme
        run: |
          node themes/contrib/frame/bin/frame.mjs new ci_theme --name "CI Theme"
          cd themes/custom/ci_theme
          test ! -e node_modules && test ! -e vite.config.js
          npm run build && npm test
          test -s assets/hello-react.js && test -s assets/global.css
          # The tokens of the theme's YAML reached its CSS.
          grep -q -- '--frame-space-m' assets/global.css
        working-directory: ${{ runner.temp }}

  drupal:
    name: Subthemes on Drupal (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
      # The runner context is not available in a job-level env.
      - run: echo "SITE=$RUNNER_TEMP/site" >> "$GITHUB_ENV"
      - name: Drupal site on SQLite with the base theme
        run: |
          composer create-project drupal/recommended-project:^11 "$SITE" --no-interaction --no-progress
          composer require drush/drush --working-dir="$SITE" --no-interaction --no-progress
          mkdir -p "$SITE/web/themes/contrib" "$SITE/web/themes/custom"
          git archive --prefix=frame/ HEAD | tar -x -C "$SITE/web/themes/contrib"
          cd "$SITE"
          vendor/bin/drush site:install minimal --db-url=sqlite://sites/default/files/.ht.sqlite --site-name="CI Site" -y
      - name: Build the base theme
        run: npm ci && npm run dist
        working-directory: ${{ env.SITE }}/web/themes/contrib/frame
      - name: Create one subtheme with frame new, one with core's generate-theme
        run: |
          node web/themes/contrib/frame/bin/frame.mjs new new_theme --name "New Theme"
          php web/core/scripts/drupal generate-theme core_theme --starterkit frame_starterkit --path themes/custom --name "Core Theme"
        working-directory: ${{ env.SITE }}
      - name: Build, test and install the subthemes
        run: |
          for theme in new_theme core_theme; do
            cd "$SITE/web/themes/custom/$theme"
            npm run build && npm test
            test ! -e node_modules/vite && test ! -e vite.config.js
            # Put the example component on every page.
            mkdir -p templates
            printf "{%% embed '%s:hello-react' with { greeting: 'Hello', start: 2 } %%}{%% block name %%}World{%% endblock %%}{%% endembed %%}\n{{ content }}\n" "$theme" > templates/region--content.html.twig
            "$SITE/vendor/bin/drush" theme:install "$theme" -y
          done
      - name: Browser
        run: npm ci && npx playwright install --with-deps chromium-headless-shell
        working-directory: demo
      - name: Check each subtheme in the browser
        run: |
          (cd "$SITE/web" && php -S 127.0.0.1:8080 .ht.router.php > "$RUNNER_TEMP/php.log" 2>&1 &)
          for theme in new_theme core_theme; do
            "$SITE/vendor/bin/drush" config:set system.theme default "$theme" -y
            "$SITE/vendor/bin/drush" cr
            echo "== $theme"
            BASE_URL=http://127.0.0.1:8080 npm --prefix demo run smoke
          done
      - name: Page builder on the last subtheme
        run: |
          (cd "$SITE/web/themes/contrib/frame" && npm run builder:install && npm run builder:build)
          # The recipe installs the module with media, breakpoints and responsive images, and keeps the theme.
          "$SITE/vendor/bin/drush" recipe themes/contrib/frame/recipes/frame_builder --input=frame_builder.theme=core_theme -y
          "$SITE/vendor/bin/drush" config:get responsive_image.styles.frame_hero id
          "$SITE/vendor/bin/drush" user:password admin admin
          "$SITE/vendor/bin/drush" cr
          BASE_URL=http://127.0.0.1:8080 npm --prefix demo run builder-smoke
      - if: failure()
        run: cat "$RUNNER_TEMP/php.log" || true
