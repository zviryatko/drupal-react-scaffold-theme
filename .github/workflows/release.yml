name: Release

# Compiled files (assets/, the editor of the page builder module) are not kept in git. A release builds them and attaches
# the theme with the module inside, ready to use without Node, to the GitHub release: frame-<version>.zip and .tar.gz.
#
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build, e.g. 1.0.0 (builds the archive, does not publish)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run dist
      # The page builder module ships inside the theme, with its compiled editor.
      - run: npm run builder:install
      - run: npm run builder:build
      - name: Package
        run: |
          v='${{ steps.version.outputs.version }}'
          mkdir -p dist
          # Tracked files without export-ignore paths (docs, demo, .github) plus the compiled assets.
          git archive --prefix=frame/ HEAD | tar -x -C dist
          cp -r assets dist/frame/assets
          cp -r modules/frame_builder/js dist/frame/modules/frame_builder/js
          # The sources of the editor are in the repository; the archive has what Drupal runs.
          rm -rf dist/frame/modules/frame_builder/editor
          # Release info for the Drupal UI and composer.
          sed -i "s/^package: Scaffold$/package: Scaffold\nversion: $v/" dist/frame/frame.info.yml
          cd dist
          zip -qr "frame-$v.zip" frame
          tar -czf "frame-$v.tar.gz" frame
      - uses: actions/upload-artifact@v4
        with:
          name: frame-${{ steps.version.outputs.version }}
          path: dist/frame-*
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ steps.version.outputs.version }}'
          gh release create "$GITHUB_REF_NAME" "dist/frame-$v.zip" "dist/frame-$v.tar.gz" \
            --title "$GITHUB_REF_NAME" --generate-notes
