name: 'React Scaffold Demo'
description: 'Example subtheme of React Scaffold: tooltip, node list and recipe explorer components, views and blocks for the demo_umami content.'
type: theme
base theme: react_scaffold
core_version_requirement: ^10.3 || ^11
package: Scaffold

libraries:
  - react_scaffold_demo/global-styling

# Drupal does not inherit regions from a base theme, so they are declared again. The base theme's page.html.twig prints exactly these.
regions:
  pre_header: Pre-header
  header: Header
  highlighted: Highlighted
  tabs: Tabs
  banner_top: 'Banner Top'
  breadcrumbs: Breadcrumbs
  page_title: 'Page Title'
  content: Content
  sidebar: Sidebar
  content_bottom: 'Content Bottom'
  footer: Footer
  bottom: Bottom
  page_top: 'Page top' # Needed by Drupal Core
  page_bottom: 'Page bottom' # Needed by Drupal Core

# Design tokens and builder features of this theme, read by the React Scaffold Builder module (ThemeKit).
# Editors pick from these: there is no free colour, and lengths are a step of the scale or a checked custom value.
react_scaffold_builder:
  uikit:
    spacing:
      xs: 0.25rem
      s: 0.5rem
      m: 1rem
      l: 2rem
      xl: 4rem
    colors:
      green: { label: 'Green', value: '#008068' }
      green-light: { label: 'Light green', value: '#e6eee0' }
      cream: { label: 'Cream', value: '#fcf4ed' }
      white: { label: 'White', value: '#ffffff' }
      ink: { label: 'Ink', value: '#333333' }
    # Type scale: the sizes an editor can give text (the Text feature, the label of a field).
    font_sizes:
      xs: 0.75rem
      s: 0.875rem
      m: 1rem
      l: 1.25rem
      xl: 1.5rem
      2xl: 2rem
      3xl: 3rem
    # Image styles offered for images: an image style, or "responsive:<responsive image style>".
    image_styles:
      - large
      - medium
      - 'responsive:3_2_image'
      - 'responsive:wide'
  # Offered on every component; a component.yml can change it (thirdPartySettings.react_scaffold_builder.features).
  features:
    spacing: true
    align: true
    text: true
    background: true
    position: true
