$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: React Tooltip
status: stable
description: 'A React-based tooltip shown on hover. The trigger is an icon, a short text, or anything placed in the content slot.'
group: Interactive
props:
  type: object
  properties:
    text:
      type: string
      title: Tooltip Text
      description: 'The text to display in the tooltip'
      default: 'Tooltip text'
      examples:
        - 'This is the tooltip text'
    label:
      type: string
      title: Trigger text
      description: 'Simple text that shows the tooltip on hover. Leave empty to use only the icon or the content slot.'
    icon:
      type: string
      title: Trigger icon
      description: 'Shown before the trigger text.'
      # The builder shows an icon picker; every value is the name of a Bootstrap Icons glyph.
      x-builder-widget: icon
      x-builder-icon-class: 'bi bi-{name}'
      enum:
        - info-circle
        - question-circle
        - exclamation-triangle
        - lightbulb
        - star
        - heart
        - check-circle
        - x-circle
        - bell
        - bookmark
        - calendar
        - clock
        - envelope
        - telephone
        - geo-alt
        - link-45deg
        - download
        - search
        - gear
        - person
        - cart
        - tag
        - chat
        - globe
  required:
    - text
slots:
  content:
    title: Content
    description: 'The content that triggers the tooltip when hovered'
    examples:
      - 'Hover me to see the tooltip'
# Page builder: the icon in the list of blocks. Features (spacing, position...) follow the theme; a component can
# switch one off or on here: `features: { background: false }`.
thirdPartySettings:
  frame_builder:
    icon: tooltip
libraryOverrides:
  js:
    ../../assets/react-tooltip.js: { attributes: { type: module } }
  css:
    theme:
      ../../assets/react-tooltip.css: { }
  dependencies:
    - frame/react
