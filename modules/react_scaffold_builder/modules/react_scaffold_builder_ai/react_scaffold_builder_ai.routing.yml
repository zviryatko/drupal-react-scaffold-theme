react_scaffold_builder_ai.chat:
  path: '/react-scaffold-builder/node/{node}/ai'
  defaults:
    _controller: '\Drupal\react_scaffold_builder_ai\Controller\AssistantController::chat'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    _permission: 'use react scaffold builder ai'
    _csrf_request_header_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
