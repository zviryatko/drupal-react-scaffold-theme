services:
  react_scaffold_builder.catalog:
    class: Drupal\react_scaffold_builder\ComponentCatalog
    arguments: ['@plugin.manager.sdc', '@theme.manager', '@module_handler', '@entity_type.manager', '@plugin.manager.field.formatter', '@plugin.manager.field.field_type', '@plugin.manager.block', '@react_scaffold_builder.features', '@react_scaffold_builder.library', '@react_scaffold_builder.paragraphs']
  react_scaffold_builder.layouts:
    class: Drupal\react_scaffold_builder\LayoutStorage
    arguments: ['@react_scaffold_builder.catalog', '@react_scaffold_builder.migrator', '@react_scaffold_builder.paragraphs']
  react_scaffold_builder.library:
    class: Drupal\react_scaffold_builder\Library
    arguments: ['@entity_type.manager', '@react_scaffold_builder.migrator']
  react_scaffold_builder.paragraphs:
    class: Drupal\react_scaffold_builder\Paragraphs
    arguments: ['@entity_type.manager', '@module_handler', '@react_scaffold_builder.paragraph_drafts']
  react_scaffold_builder.paragraph_drafts:
    class: Drupal\react_scaffold_builder\ParagraphDrafts
    arguments: ['@tempstore.private']
  react_scaffold_builder.migrator:
    class: Drupal\react_scaffold_builder\LayoutMigrator
    arguments: ['@plugin.manager.sdc', '@module_handler', '@theme.manager', '@theme.initialization', '@config.factory']
  react_scaffold_builder.renderer:
    class: Drupal\react_scaffold_builder\LayoutRenderer
    arguments: ['@react_scaffold_builder.catalog', '@token', '@plugin.manager.field.formatter', '@plugin.manager.block', '@current_user', '@react_scaffold_builder.features', '@react_scaffold_builder.media_items', '@renderer', '@react_scaffold_builder.library', '@react_scaffold_builder.paragraphs']
  react_scaffold_builder.node_properties:
    class: Drupal\react_scaffold_builder\NodeProperties
    arguments: ['@module_handler', '@current_user']
  react_scaffold_builder.media_items:
    class: Drupal\react_scaffold_builder\MediaItems
    arguments: ['@entity_type.manager', '@file_url_generator']
  # Only collected when the Media Library module is installed.
  react_scaffold_builder.media_library_opener:
    class: Drupal\react_scaffold_builder\MediaLibraryOpener
    arguments: ['@entity_type.manager', '@react_scaffold_builder.media_items']
    tags:
      - { name: media_library.opener }
  react_scaffold_builder.theme_kit:
    class: Drupal\react_scaffold_builder\ThemeKit
    arguments: ['@theme.manager', '@module_handler', '@entity_type.manager']
  react_scaffold_builder.features:
    class: Drupal\react_scaffold_builder\ComponentFeatures
    arguments: ['@react_scaffold_builder.theme_kit', '@react_scaffold_builder.media_items']
  react_scaffold_builder.route_subscriber:
    class: Drupal\react_scaffold_builder\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  react_scaffold_builder.field_drafts:
    class: Drupal\react_scaffold_builder\FieldDrafts
    arguments: ['@tempstore.private']
