# The builder as an admin page: Drupal's admin theme, toolbar and navigation
# stay around it. The editor itself runs in a frame served by the front-end
# theme, so components look and behave as on the site.
react_scaffold_builder.editor:
  path: '/node/{node}/builder'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::host'
    _title_callback: '\Drupal\react_scaffold_builder\Controller\BuilderController::title'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

react_scaffold_builder.editor_frame:
  path: '/node/{node}/builder/frame'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::editor'
    _title_callback: '\Drupal\react_scaffold_builder\Controller\BuilderController::title'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

# The node's field widgets, in a frame of the editor (admin theme).
react_scaffold_builder.content_form:
  path: '/node/{node}/builder/content'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::contentForm'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

react_scaffold_builder.save:
  path: '/react-scaffold-builder/node/{node}/save'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::save'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    _csrf_request_header_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

react_scaffold_builder.render:
  path: '/react-scaffold-builder/render'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::render'
  methods: [POST]
  requirements:
    _permission: 'use react scaffold builder'
    _csrf_request_header_token: 'TRUE'

react_scaffold_builder.urls:
  path: '/react-scaffold-builder/urls'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::urls'
  methods: [GET]
  requirements:
    _permission: 'use react scaffold builder'

react_scaffold_builder.media:
  path: '/react-scaffold-builder/media'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::media'
  methods: [GET]
  requirements:
    _permission: 'use react scaffold builder'

react_scaffold_builder.tokens:
  path: '/react-scaffold-builder/tokens'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::tokens'
  methods: [GET]
  requirements:
    _permission: 'use react scaffold builder'

# Drupal's media library in a frame. An admin route, so it is rendered by the
# admin theme, which is the theme that styles the media library.
react_scaffold_builder.media_frame:
  path: '/react-scaffold-builder/media-library'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::mediaFrame'
  methods: [GET]
  requirements:
    _permission: 'use react scaffold builder'
  options:
    _admin_route: TRUE

# Settings form of a field formatter, in a frame of the editor (admin theme).
react_scaffold_builder.formatter_settings:
  path: '/node/{node}/builder/formatter'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::formatterSettings'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node

# Per-user autosave of unsaved editor state: lets the editor be reloaded, and
# feeds the preview.
react_scaffold_builder.draft:
  path: '/react-scaffold-builder/node/{node}/draft'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::draft'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    _csrf_request_header_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

# The page as visitors would see it, with the user's unsaved layout.
react_scaffold_builder.preview:
  path: '/node/{node}/builder/preview'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::preview'
    _title_callback: '\Drupal\react_scaffold_builder\Controller\BuilderController::title'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node

# The same settings form as an HTMX fragment, shown inline in the sidebar
# (Drupal 11.2+, where core ships HTMX). `_htmx_route` makes Drupal answer
# with the form only, plus the assets it needs.
react_scaffold_builder.formatter_form:
  path: '/node/{node}/builder/formatter-form'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::formatterForm'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    _htmx_route: TRUE
    # The answer is a small fragment that must be complete at once. (BigPipe
    # also mishandles the page state HTMX sends, which filled the log with
    # warnings about a library without a name.)
    _no_big_pipe: TRUE
    parameters:
      node:
        type: entity:node

# The library of saved blocks (BuilderController::library).
react_scaffold_builder.library:
  path: '/react-scaffold-builder/library'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::library'
  methods: [GET, POST]
  requirements:
    _permission: 'use react scaffold builder'
    _csrf_request_header_token: 'TRUE'

# The form of a paragraph, for a Paragraph block (with the Paragraphs module).
react_scaffold_builder.paragraph_form:
  path: '/node/{node}/builder/paragraph'
  defaults:
    _controller: '\Drupal\react_scaffold_builder\Controller\BuilderController::paragraphForm'
  requirements:
    _custom_access: '\Drupal\react_scaffold_builder\Controller\BuilderController::access'
    node: \d+
  options:
    _admin_route: TRUE
    parameters:
      node:
        type: entity:node
