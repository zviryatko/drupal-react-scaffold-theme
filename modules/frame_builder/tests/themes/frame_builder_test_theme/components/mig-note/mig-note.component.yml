$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Migrated note'
description: 'A component whose version 2 gives a translatable prop a default (LayoutMigratorTest).'
group: Test
props:
  type: object
  properties:
    label:
      type: string
      title: Label
    text:
      type: string
      title: Text
thirdPartySettings:
  frame_builder:
    version: 2
    migrations:
      2:
        defaults: { label: 'Note' }
