frame_builder_ai.chat:
  path: '/frame-builder/node/{node}/ai'
  defaults:
    _controller: '\Drupal\frame_builder_ai\Controller\AssistantController::chat'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\frame_builder\Controller\BuilderController::access'
    _permission: 'use frame builder ai'
    _csrf_request_header_token: 'TRUE'
    node: \d+
  options:
    parameters:
      node:
        type: entity:node
