name: 'React Scaffold'
description: 'Base theme for React islands built as core Single Directory Components. Provides React, helpers, the API client, a page layout and a shared Vite/Jest config. Create a subtheme to use it.'
type: theme
base theme: false
core_version_requirement: ^10.3 || ^11
package: Scaffold

# Inherited by every subtheme.
libraries:
  - react_scaffold/global-styling
  - react_scaffold/global-libraries

regions:
  pre_header: Pre-header
  header: Header
  highlighted: Highlighted
  tabs: Tabs
  banner_top: 'Banner Top'
  breadcrumbs: Breadcrumbs
  page_title: 'Page Title'
  content: Content
  sidebar: Sidebar
  content_bottom: 'Content Bottom'
  footer: Footer
  bottom: Bottom
  page_top: 'Page top' # Needed by Drupal Core
  page_bottom: 'Page bottom' # Needed by Drupal Core
