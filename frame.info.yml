name: 'Frame'
description: 'Base theme of the Frame page builder: ready components, a page layout, and React with helpers, the API client and a shared Vite/Jest config for interactive components. Create a subtheme to use it.'
type: theme
base theme: false
core_version_requirement: ^10.3 || ^11
package: Frame

# Inherited by every subtheme.
libraries:
  - frame/global-styling
  - frame/global-libraries

regions:
  pre_header: Pre-header
  header: Header
  highlighted: Highlighted
  tabs: Tabs
  banner_top: 'Banner Top'
  breadcrumbs: Breadcrumbs
  page_title: 'Page Title'
  content: Content
  sidebar: Sidebar
  content_bottom: 'Content Bottom'
  footer: Footer
  bottom: Bottom
  page_top: 'Page top' # Needed by Drupal Core
  page_bottom: 'Page bottom' # Needed by Drupal Core
