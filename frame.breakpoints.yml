# Breakpoints of the base theme (Drupal's Breakpoint module). A subtheme without a <theme>.breakpoints.yml of its own
# uses these: the page builder offers their widths in its preview, SCSS gets them as frame.breakpoint(tablet), and the
# responsive image style of the page builder recipe maps them to image styles.
frame.mobile:
  label: Mobile
  mediaQuery: ''
  weight: 0
  multipliers:
    - 1x
frame.tablet:
  label: Tablet
  mediaQuery: 'all and (min-width: 48em)'
  weight: 1
  multipliers:
    - 1x
frame.desktop:
  label: Desktop
  mediaQuery: 'all and (min-width: 75em)'
  weight: 2
  multipliers:
    - 1x
