name: 'React Scaffold page builder: AI assistant'
description: 'The chat assistant of the page builder: the AI module and React Scaffold Builder AI, with the permission for content editors. Add a provider module (OpenAI, Anthropic, Ollama...) and make it the default for chat.'
type: 'Page builder'
recipes:
  - react_scaffold_builder
install:
  - ai
  - react_scaffold_builder_ai
config:
  strict: false
  actions:
    user.role.content_editor:
      grantPermissions:
        - 'use react scaffold builder ai'
