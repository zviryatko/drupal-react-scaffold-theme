name: 'React Scaffold page builder'
description: 'A site ready for the page builder: the React Scaffold theme and its builder module, the Landing page content type, the media library with image media, breakpoints and responsive image styles, and a Content editor role that can use it all.'
type: 'Page builder'
recipes:
  # The "Image" media type with the media library, and the image styles Medium, Large and Thumbnail.
  - core/recipes/image_media_type
  # Image styles up to 325, 650, 1300 and 2600 pixels and the responsive image styles "Narrow" and "Wide".
  - core/recipes/standard_responsive_images
  # A text format with CKEditor for rich text props.
  - core/recipes/basic_html_format_editor
  - core/recipes/content_editor_role
install:
  # The base theme. Install your subtheme yourself and name it in the "theme" input.
  - react_scaffold
  - react_scaffold_builder
  - breakpoint
  - responsive_image
  - media_library
  - menu_ui
  - path
input:
  theme:
    data_type: string
    description: 'Machine name of the theme to make the default: react_scaffold or your subtheme of it, already installed. Without a value the default theme of the site is kept.'
    constraints:
      NotBlank: []
    default:
      source: config
      config: ['system.theme', 'default']
config:
  # What exists already is kept as it is.
  strict: false
  import:
    # The "Landing page" content type, with the builder switched on.
    react_scaffold_builder: '*'
  actions:
    system.theme:
      simpleConfigUpdate:
        default: ${theme}
    user.role.content_editor:
      grantPermissions:
        - 'use react scaffold builder'
        - 'create landing_page content'
        - 'edit any landing_page content'
        - 'delete own landing_page content'
        - 'view landing_page revisions'
        - 'revert landing_page revisions'
        - 'access media overview'
        - 'create media'
        - 'update media'
        - 'delete media'
        - 'view own unpublished media'
        - 'create url aliases'
        - 'use text format basic_html'
