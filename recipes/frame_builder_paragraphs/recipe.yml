name: 'Frame page builder: paragraphs'
description: 'Paragraph types as blocks of the page builder: Paragraphs with Entity Reference Revisions, the Paragraphs Library for paragraphs reused across pages, Entity Usage to see where media, paragraphs and saved blocks are used, and a starter paragraph type "Text block".'
type: 'Page builder'
recipes:
  - frame_builder
install:
  - entity_reference_revisions
  - paragraphs
  - paragraphs_library
  - entity_usage
config:
  strict: false
  import:
    # The paragraph type "From library", the view of the library and its displays. Listed one by one: the module
    # also has optional configuration for Entity Browser.
    paragraphs_library:
      - paragraphs.paragraphs_type.from_library
      - field.storage.paragraph.field_reusable_paragraph
      - field.field.paragraph.from_library.field_reusable_paragraph
      - core.entity_form_display.paragraph.from_library.default
      - core.entity_view_display.paragraph.from_library.default
      - core.entity_view_mode.paragraphs_library_item.summary
      - core.entity_view_display.paragraphs_library_item.paragraphs_library_item.summary
      - views.view.paragraphs_library
  actions:
    # A "Usage" tab on media, library items and content.
    entity_usage.settings:
      simpleConfigUpdate:
        local_task_enabled_entity_types:
          - media
          - node
          - paragraphs_library_item
    user.role.content_editor:
      grantPermissions:
        - 'create paragraph library item'
        - 'edit paragraph library item'
        - 'access entity usage statistics'
