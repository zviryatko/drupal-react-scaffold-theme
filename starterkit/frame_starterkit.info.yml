name: 'Frame Starterkit'
description: 'Starterkit of Frame: generate your own subtheme with `generate-theme --starterkit frame_starterkit`.'
type: theme
'base theme': frame
core_version_requirement: ^10.3 || ^11
package: Frame
version: 1.0.0
# Never shown in the UI, it is only a template for the generator.
hidden: true

# Added to every page, on top of the libraries inherited from Frame.
libraries:
  - frame_starterkit/global-styling

# The design tokens of the theme, declared once. The page builder (the Frame Builder module, inside the base
# theme) offers them to editors, and scss/global.scss gets them with `@use 'frame/tokens' as frame;`.
# Change them to your design; see "Tokens, features and styling" in the docs. Breakpoints come from the base theme
# (mobile, tablet, desktop) until the theme has a <theme>.breakpoints.yml of its own.
frame_builder:
  uikit:
    spacing:
      xs: 0.25rem
      s: 0.5rem
      m: 1rem
      l: 2rem
      xl: 4rem
    colors:
      white: { label: 'White', value: '#ffffff' }
      light: { label: 'Light grey', value: '#f3f4f9' }
      dark: { label: 'Dark', value: '#232429' }
    font_sizes:
      xs: 0.75rem
      s: 0.875rem
      m: 1rem
      l: 1.25rem
      xl: 1.5rem
      2xl: 2rem
      3xl: 3rem
    # How wide a component may be and how tall it is at least ("Size" in the builder).
    sizes:
      xs: 20rem
      s: 30rem
      m: 45rem
      l: 60rem
      xl: 75rem
      full: 100%

# Drupal does not inherit regions from a base theme, so they are declared here. Keep this list equal to frame.info.yml,
# the base theme's page.html.twig prints exactly these regions (a test checks it).
regions:
  pre_header: Pre-header
  header: Header
  highlighted: Highlighted
  tabs: Tabs
  banner_top: 'Banner Top'
  breadcrumbs: Breadcrumbs
  page_title: 'Page Title'
  content: Content
  sidebar: Sidebar
  content_bottom: 'Content Bottom'
  footer: Footer
  bottom: Bottom
  page_top: 'Page top' # Needed by Drupal Core
  page_bottom: 'Page bottom' # Needed by Drupal Core
